plugins {
    id 'com.android.application'
}

def appVersionName = (rootProject.findProperty('appVersionName') ?: '1.0').toString()
def appVersionCode = (rootProject.findProperty('appVersionCode') ?: '1').toString().toInteger()

android {
    compileSdk 35
    namespace 'io.github.blazeftl.glmassist'
    defaultConfig {
        applicationId "io.github.blazeftl.glmassist"
        minSdk 26
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName
        resourceConfigurations += ['en']
    }
    signingConfigs {
        release {
            storeFile file('release.jks')
            storePassword 'glmassist'
            keyAlias 'glm'
            keyPassword 'glmassist'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    packaging {
        resources {
            excludes += ['META-INF/*.version', 'META-INF/*.kotlin_module', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/AL2.0', 'META-INF/LGPL2.1', 'kotlin/**', 'kotlin-tooling-metadata.json', 'DebugProbesKt.bin']
        }
    }
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
