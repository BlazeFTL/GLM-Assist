plugins {
    id 'com.android.application'
}

android {
    compileSdk 35
    namespace 'io.github.blazeftl.glmassist'
    defaultConfig {
        applicationId "io.github.blazeftl.glmassist"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
