name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle
      - run: chmod +x ./gradlew
      - run: ./gradlew assembleRelease
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv app/build/outputs/apk/release/app-release.apk glmAssist.apk
          gh release create "build-${{ github.run_number }}" glmAssist.apk \
            --title "glmAssist build ${{ github.run_number }}" \
            --notes "Commit ${{ github.sha }}"
